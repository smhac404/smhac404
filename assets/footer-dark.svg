<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="180" viewBox="0 0 1600 180">
  <defs>
    <!-- ================================= -->
    <!-- DARK FOOTER BACKGROUND GRADIENT -->
    <!-- ================================= -->
    <linearGradient id="footerBG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1121">
        <animate attributeName="stop-color" values="#0B1121;#0F172A;#0B1121" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1E1B4B">
        <animate attributeName="stop-color" values="#1E1B4B;#2D1B69;#1E1B4B" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#1E1B4B;#0F172A" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- ================================= -->
    <!-- TOP ACCENT GRADIENT -->
    <!-- ================================= -->
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- ================================= -->
    <!-- GLOW FILTER -->
    <!-- ================================= -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ================================= -->
    <!-- SUBTLE SHADOW -->
    <!-- ================================= -->
    <filter id="footerShadow">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#000000" flood-opacity=".30"/>
    </filter>

    <!-- ================================= -->
    <!-- NOISE TEXTURE -->
    <!-- ================================= -->
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .04"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->
  <rect width="1600" height="180" fill="url(#footerBG)" filter="url(#footerShadow)"/>

  <!-- ================================= -->
  <!-- NOISE TEXTURE -->
  <!-- ================================= -->
  <rect width="1600" height="180" filter="url(#noiseFilter)" opacity=".15"/>

  <!-- ================================= -->
  <!-- TOP ACCENT BAR -->
  <!-- ================================= -->
  <rect width="1600" height="4" fill="url(#accentBar)"/>

  <!-- ================================= -->
  <!-- SUBTLE AURORA -->
  <!-- ================================= -->
  <ellipse cx="300" cy="180" rx="350" ry="60" fill="#8B5CF6" opacity=".12">
    <animate attributeName="rx" values="300;420;300" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1300" cy="180" rx="300" ry="55" fill="#6D28D9" opacity=".10">
    <animate attributeName="rx" values="280;400;280" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================= -->
  <g fill="#C4B5FD" filter="url(#glow)">
    <circle cx="200" cy="90" r="3">
      <animate attributeName="cy" values="90;75;90" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="60" r="2.5">
      <animate attributeName="cy" values="60;80;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.9;.3" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="110" r="3">
      <animate attributeName="cy" values="110;85;110" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;1;.4" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="70" r="2.5">
      <animate attributeName="cy" values="70;95;70" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.9;.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1300" cy="95" r="3">
      <animate attributeName="cy" values="95;75;95" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;1;.4" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1480" cy="65" r="2">
      <animate attributeName="cy" values="65;85;65" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.8;.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================= -->
  <!-- MAIN MESSAGE -->
  <!-- ================================= -->
  <text x="800" y="100" text-anchor="middle" font-family="SF Pro Display,Segoe UI,Arial" font-size="26" font-weight="600" fill="#E2E8F0" filter="url(#glow)">
    Thanks for visiting my profile
    <animate attributeName="opacity" values=".75;1;.75" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- ================================= -->
  <!-- BOTTOM DECORATIVE LINE -->
  <!-- ================================= -->
  <path d="M600 140 Q800 133 1000 140" stroke="#A78BFA" stroke-opacity=".10" stroke-width="1.5" fill="none">
    <animate attributeName="d" values="M600 140 Q800 133 1000 140;M600 135 Q800 145 1000 135;M600 140 Q800 133 1000 140" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- ================================= -->
  <!-- CORNER DECORATIONS -->
  <!-- ================================= -->
  <circle cx="30" cy="150" r="20" fill="#8B5CF6" opacity=".06">
    <animate attributeName="r" values="18;25;18" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1570" cy="150" r="20" fill="#6D28D9" opacity=".06">
    <animate attributeName="r" values="18;25;18" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
