<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 180">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">

<stop offset="0%" stop-color="#312E81"/>

<stop offset="50%" stop-color="#6D28D9"/>

<stop offset="100%" stop-color="#8B5CF6"/>

<animateTransform
attributeName="gradientTransform"
type="translate"
values="-1 0;1 0;-1 0"
dur="12s"
repeatCount="indefinite"/>

</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="3"/>
</filter>

</defs>

<rect width="1600" height="180" fill="#050816"/>

<rect width="1600" height="8" fill="url(#bg)"/>

<g fill="#C084FC">

<circle cx="250" cy="90" r="3">
<animate attributeName="cy"
values="90;75;90"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="550" cy="60" r="2">
<animate attributeName="cy"
values="60;80;60"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="110" r="3">
<animate attributeName="cy"
values="110;90;110"
dur="6s"
repeatCount="indefinite"/>
</circle>

<circle cx="1300" cy="70" r="2">
<animate attributeName="cy"
values="70;95;70"
dur="4.5s"
repeatCount="indefinite"/>
</circle>

</g>

<text
x="800"
y="95"
fill="#FFFFFF"
font-family="JetBrains Mono, monospace"
font-size="24"
font-weight="600"
text-anchor="middle">

Thanks for visiting my profile

<animate
attributeName="opacity"
values="0.7;1;0.7"
dur="3s"
repeatCount="indefinite"/>

</text>

<text
x="800"
y="130"
fill="#C4B5FD"
font-family="JetBrains Mono, monospace"
font-size="15"
text-anchor="middle">

Generative AI • LLM • RAG • Agentic AI

</text>

</svg>