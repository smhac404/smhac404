<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">
<defs>
<linearGradient id="bg" x1="0" x1="0" y1="0" y2="1">
<stop offset="0%" stop-color="#F8FAFC"/>
<stop offset="50%" stop-color="#BFDBFE"/>
<stop offset="100%" stop-color="#E9D5FF"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="500" fill="url(#bg)"/>
<ellipse cx="300" cy="120" rx="320" ry="120" fill="#8B5CF6" opacity=".08">
<animate attributeName="cx" values="250;350;250" dur="12s" repeatCount="indefinite"/>
</ellipse>
<g filter="url(#glow)" stroke="#A855F7" stroke-width="2" fill="#C084FC">
<line x1="1080" y1="120" x2="1240" y2="180"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></line>
<line x1="1240" y1="180" x2="1380" y2="120"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></line>
<line x1="1240" y1="180" x2="1320" y2="320"/>
<circle cx="1080" cy="120" r="7"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="1240" cy="180" r="7"><animate attributeName="r" values="7;11;7" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="1380" cy="120" r="7"><animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1320" cy="320" r="7"><animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<text x="120" y="170" fill="#111827" font-size="56" font-family="monospace" font-weight="700" opacity="0">SWASTIK MOHANTY
<animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/></text>
<text x="120" y="220" fill="#4F46E5" font-size="24" font-family="monospace">Enterprise AI Engineer • LLM • RAG • Agentic AI</text>
</svg>