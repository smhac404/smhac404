<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <!-- ================================= -->
    <!-- LIGHT BACKGROUND GRADIENT -->
    <!-- ================================= -->
    <linearGradient id="lightBG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFF">
        <animate attributeName="stop-color" values="#FAFAFF;#F0F0FF;#FAFAFF" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F0F0FF">
        <animate attributeName="stop-color" values="#F0F0FF;#EEF2FF;#F0F0FF" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- ================================= -->
    <!-- GLASS PANEL -->
    <!-- ================================= -->
    <linearGradient id="lightGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".70"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".50"/>
    </linearGradient>

    <!-- ================================= -->
    <!-- TEXT GRADIENT -->
    <!-- ================================= -->
    <linearGradient id="lightText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#7C3AED;#4F46E5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#6366F1;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#4F46E5;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- ================================= -->
    <!-- AURORA -->
    <!-- ================================= -->
    <radialGradient id="violetGlow">
      <stop offset="0%" stop-color="#818CF8" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity=".10"/>
    </filter>

    <!-- ================================= -->
    <!-- GLOW FILTER -->
    <!-- ================================= -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ================================= -->
    <!-- PARTICLE GRADIENT -->
    <!-- ================================= -->
    <radialGradient id="particle">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="40%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->
  <rect width="1600" height="500" fill="url(#lightBG)"/>

  <!-- ================================= -->
  <!-- AURORA LIGHTS -->
  <!-- ================================= -->
  <ellipse cx="250" cy="120" rx="300" ry="160" fill="url(#violetGlow)" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;45 -22;0 0" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1350" cy="100" rx="280" ry="150" fill="url(#purpleGlow)" filter="url(#softBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-35 22;0 0" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================= -->
  <!-- AI NETWORK CONNECTIONS -->
  <!-- ================================= -->
  <g stroke="#818CF8" stroke-opacity=".25" stroke-width="2" fill="none" filter="url(#glow)">
    <path d="M180 150 L400 220 L620 120 L820 200 L1080 130 L1400 220">
      <animate attributeName="stroke-opacity" values=".15;.50;.15" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M400 220 L820 200">
      <animate attributeName="stroke-opacity" values=".20;.55;.20" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M620 120 L1080 130">
      <animate attributeName="stroke-opacity" values=".15;.45;.15" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M180 150 L620 120">
      <animate attributeName="stroke-opacity" values=".12;.40;.12" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M1080 130 L1400 220">
      <animate attributeName="stroke-opacity" values=".12;.40;.12" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ================================= -->
  <!-- MOVING DATA SIGNALS -->
  <!-- ================================= -->
  <circle r="4.5" fill="#818CF8" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M180 150 L400 220 L620 120 L820 200 L1080 130 L1400 220"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle r="3.5" fill="#A78BFA" filter="url(#glow)">
    <animateMotion dur="9s" begin="3s" repeatCount="indefinite" path="M400 220 L820 200 L1080 130"/>
    <animate attributeName="opacity" values="0;.9;.9;0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle r="3" fill="#6366F1" filter="url(#glow)">
    <animateMotion dur="11s" begin="5s" repeatCount="indefinite" path="M180 150 L620 120 L1080 130"/>
    <animate attributeName="opacity" values="0;.8;.8;0" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================= -->
  <!-- NETWORK NODES -->
  <!-- ================================= -->
  <g filter="url(#glow)">
    <circle cx="180" cy="150" r="6" fill="#818CF8">
      <animate attributeName="r" values="5;9;5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="220" r="7" fill="#6366F1">
      <animate attributeName="r" values="6;10;6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="120" r="6" fill="#818CF8">
      <animate attributeName="r" values="5;9;5" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="200" r="7" fill="#A78BFA">
      <animate attributeName="r" values="6;10;6" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="130" r="6" fill="#818CF8">
      <animate attributeName="r" values="5;9;5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="220" r="7" fill="#6366F1">
      <animate attributeName="r" values="6;10;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Sub-nodes -->
    <circle cx="280" cy="185" r="3.5" fill="#A78BFA" opacity=".5">
      <animate attributeName="opacity" values=".3;.8;.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="160" r="3.5" fill="#A78BFA" opacity=".5">
      <animate attributeName="opacity" values=".3;.8;.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="165" r="3.5" fill="#A78BFA" opacity=".5">
      <animate attributeName="opacity" values=".3;.8;.3" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================= -->
  <!-- GLOWING PARTICLES -->
  <!-- ================================= -->
  <g>
    <circle cx="120" cy="90" r="5" fill="url(#particle)">
      <animateTransform attributeName="transform" type="translate" values="0 0;25 -28;0 0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;1;.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="70" r="4" fill="url(#particle)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-22 32;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="60" r="5" fill="url(#particle)">
      <animateTransform attributeName="transform" type="translate" values="0 0;28 -22;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="70" r="4" fill="url(#particle)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-28 22;0 0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1250" cy="70" r="5" fill="url(#particle)">
      <animateTransform attributeName="transform" type="translate" values="0 0;32 -18;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="120" r="4" fill="url(#particle)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-28 28;0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================= -->
  <!-- GLASS CARD -->
  <!-- ================================= -->
  <rect x="310" y="80" width="980" height="260" rx="38" fill="url(#lightGlass)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Glass highlight -->
  <path d="M350 108 H1250" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.5"/>
  <path d="M350 118 H1250" stroke="#FFFFFF" stroke-opacity=".25" stroke-width=".5"/>

  <!-- Corner accent -->
  <circle cx="1180" cy="115" r="90" fill="#818CF8" opacity=".06">
    <animate attributeName="r" values="75;100;75" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================= -->
  <!-- FLOATING SYMBOLS -->
  <!-- ================================= -->
  <g font-family="JetBrains Mono,monospace" font-size="28" font-weight="600" fill="#818CF8" opacity=".14">
    <text x="140" y="290">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="360">
      {}
      <animateTransform attributeName="transform" type="translate" values="0 0;18 -18;0 0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="115">
      AI
      <animateTransform attributeName="transform" type="translate" values="0 0;-18 22;0 0" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="1120" y="95">
      LLM
      <animateTransform attributeName="transform" type="translate" values="0 0;22 18;0 0" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="1350" y="330">
      RAG
      <animateTransform attributeName="transform" type="translate" values="0 0;-22 -18;0 0" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="1060" y="380">FastAPI</text>
    <text x="420" y="430">Python</text>
    <text x="1450" y="150">⚡</text>
  </g>

  <!-- ================================= -->
  <!-- MAIN TITLE -->
  <!-- ================================= -->
  <text x="800" y="175" text-anchor="middle" font-family="SF Pro Display,Segoe UI,Arial" font-size="66" font-weight="700" fill="url(#lightText)" letter-spacing="-0.5">
    Swastik Mohanty
  </text>

  <!-- ================================= -->
  <!-- ROLE -->
  <!-- ================================= -->
  <text x="800" y="220" text-anchor="middle" font-family="SF Pro Display,Segoe UI" font-size="26" letter-spacing="3" fill="#6366F1" opacity=".8">
    AI ENGINEER
  </text>

  <!-- ================================= -->
  <!-- DIVIDER -->
  <!-- ================================= -->
  <line x1="530" y1="245" x2="1070" y2="245" stroke="#818CF8" stroke-opacity=".20" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values=".12;.32;.12" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cx="800" cy="245" r="3" fill="#818CF8" opacity=".4">
    <animate attributeName="r" values="2;6;2" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================= -->
  <!-- DESCRIPTION -->
  <!-- ================================= -->
  <text x="800" y="288" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="22" fill="#4F46E5" opacity=".85">
    Building LLM Systems
  </text>

  <!-- ================================= -->
  <!-- TECH TAGS -->
  <!-- ================================= -->
  <text x="800" y="325" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="19" fill="#818CF8" opacity=".75">
    RAG • Multi-Agent AI • NLP • Python • FastAPI • Azure
  </text>

  <!-- ================================= -->
  <!-- BOTTOM AURORA -->
  <!-- ================================= -->
  <ellipse cx="800" cy="450" rx="520" ry="85" fill="#818CF8" opacity=".10" filter="url(#softBlur)">
    <animate attributeName="rx" values="460;620;460" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================= -->
  <!-- ANIMATED WAVES -->
  <!-- ================================= -->
  <path fill="#818CF8" fill-opacity=".07">
    <animate attributeName="d" dur="17s" repeatCount="indefinite"
      values="
        M0 420 C300 350 600 470 900 410 C1200 350 1450 460 1600 400 L1600 500 L0 500Z;
        M0 400 C300 470 600 360 900 430 C1200 480 1450 370 1600 430 L1600 500 L0 500Z;
        M0 420 C300 350 600 470 900 410 C1200 350 1450 460 1600 400 L1600 500 L0 500Z
      "/>
  </path>

  <path fill="#A78BFA" fill-opacity=".05">
    <animate attributeName="d" dur="21s" repeatCount="indefinite"
      values="
        M0 450 C350 390 700 500 1000 430 C1300 380 1500 470 1600 440 L1600 500 L0 500Z;
        M0 430 C350 500 700 390 1000 450 C1300 500 1500 410 1600 450 L1600 500 L0 500Z;
        M0 450 C350 390 700 500 1000 430 C1300 380 1500 470 1600 440 L1600 500 L0 500Z
      "/>
  </path>

  <!-- ================================= -->
  <!-- EDGE ACCENT -->
  <!-- ================================= -->
  <rect x="0" y="0" width="1600" height="500" fill="none" stroke="#818CF8" stroke-opacity=".04"/>
</svg>
