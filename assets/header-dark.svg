<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
width="1600"
height="500"
viewBox="0 0 1600 500">

<!-- ===================================== -->
<!--              DEFINITIONS              -->
<!-- ===================================== -->

<defs>

<!-- ============================= -->
<!-- Animated Background Gradient -->
<!-- ============================= -->

<linearGradient
id="bgGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#0F172A">
<animate
attributeName="stop-color"
values="
#0F172A;
#111827;
#1E1B4B;
#0F172A"
dur="14s"
repeatCount="indefinite"/>
</stop>

<stop offset="50%" stop-color="#4F46E5">

<animate
attributeName="stop-color"

values="
#4F46E5;
#7C3AED;
#8B5CF6;
#4F46E5"

dur="14s"

repeatCount="indefinite"/>

</stop>

<stop offset="100%" stop-color="#8B5CF6">

<animate
attributeName="stop-color"

values="
#8B5CF6;
#6D28D9;
#4F46E5;
#8B5CF6"

dur="14s"

repeatCount="indefinite"/>

</stop>

</linearGradient>

<!-- ============================= -->
<!-- Glass Gradient -->
<!-- ============================= -->

<linearGradient id="glassGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop
offset="0%"
stop-color="#FFFFFF"
stop-opacity=".16"/>

<stop
offset="45%"
stop-color="#FFFFFF"
stop-opacity=".08"/>

<stop
offset="100%"
stop-color="#FFFFFF"
stop-opacity=".03"/>

</linearGradient>

<!-- ============================= -->
<!-- Glass Border -->
<!-- ============================= -->

<linearGradient id="glassBorder"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity=".45"/>

<stop offset="100%"
stop-color="#A78BFA"
stop-opacity=".15"/>

</linearGradient>

<!-- ============================= -->
<!-- Aurora Gradient -->
<!-- ============================= -->

<radialGradient id="auroraPurple">

<stop offset="0%"
stop-color="#8B5CF6"
stop-opacity=".55"/>

<stop offset="100%"
stop-color="#8B5CF6"
stop-opacity="0"/>

</radialGradient>

<radialGradient id="auroraBlue">

<stop offset="0%"
stop-color="#4F46E5"
stop-opacity=".45"/>

<stop offset="100%"
stop-color="#4F46E5"
stop-opacity="0"/>

</radialGradient>

<!-- ============================= -->
<!-- Soft Glow -->
<!-- ============================= -->

<filter id="glow">

<feGaussianBlur
stdDeviation="40"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<!-- ============================= -->
<!-- Glass Shadow -->
<!-- ============================= -->

<filter id="glassShadow">

<feDropShadow

dx="0"

dy="20"

stdDeviation="30"

flood-opacity=".30"/>

</filter>

<!-- ============================= -->
<!-- Noise Pattern -->
<!-- ============================= -->

<filter id="noise">

<feTurbulence
type="fractalNoise"
baseFrequency=".85"
numOctaves="3"
seed="5"/>

<feColorMatrix
type="saturate"
values="0"/>

<feComponentTransfer>

<feFuncA
type="table"
tableValues="0 .03"/>

</feComponentTransfer>

</filter>

</defs>

<!-- ===================================== -->
<!-- Background -->
<!-- ===================================== -->

<rect

width="1600"

height="500"

fill="url(#bgGradient)"/>

<!-- ===================================== -->
<!-- Noise -->
<!-- ===================================== -->

<rect

width="1600"

height="500"

filter="url(#noise)"

opacity=".18"/>

<!-- ===================================== -->
<!-- Aurora Glow -->
<!-- ===================================== -->

<g filter="url(#glow)">

<ellipse

cx="260"

cy="120"

rx="260"

ry="140"

fill="url(#auroraPurple)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;35 -18;0 0"

dur="12s"

repeatCount="indefinite"/>

</ellipse>

<ellipse

cx="1360"

cy="110"

rx="240"

ry="120"

fill="url(#auroraBlue)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;-30 18;0 0"

dur="14s"

repeatCount="indefinite"/>

</ellipse>

</g>

<!-- ===================================== -->
<!-- Glass Card -->
<!-- ===================================== -->

<rect

x="320"

y="85"

width="960"

height="250"

rx="34"

fill="url(#glassGradient)"

stroke="url(#glassBorder)"

stroke-width="1.3"

filter="url(#glassShadow)"/>

<!-- ===================================== -->
<!-- Glass Highlight -->
<!-- ===================================== -->

<path

d="

M360 110

H1240

"

stroke="#FFFFFF"

stroke-opacity=".22"

stroke-width="1"/>

<!-- ===================================== -->
<!-- Corner Light -->
<!-- ===================================== -->

<circle

cx="1180"

cy="120"

r="80"

fill="#8B5CF6"

opacity=".12">

<animate

attributeName="r"

values="70;85;70"

dur="8s"

repeatCount="indefinite"/>

</circle>

<!-- ===================================== -->
<!-- PART 1 END -->
<!-- Next: AI Network + Particles -->

<!-- ===================================== -->
<!--        AI NEURAL NETWORK LAYER        -->
<!-- ===================================== -->

<defs>

<!-- Network Glow -->

<filter id="networkGlow">

<feGaussianBlur
stdDeviation="2.5"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>


<!-- Particle Glow -->

<radialGradient id="particle">

<stop
offset="0%"
stop-color="#FFFFFF"/>

<stop
offset="35%"
stop-color="#DDD6FE"/>

<stop
offset="100%"
stop-color="#8B5CF6"
stop-opacity="0"/>

</radialGradient>


</defs>


<!-- ===================================== -->
<!-- AI CONNECTION LINES -->
<!-- ===================================== -->


<g

fill="none"

stroke="#C4B5FD"

stroke-width="1.5"

stroke-opacity=".35"

filter="url(#networkGlow)">


<path d="
M180 150
L390 220
L620 120
L820 200
L1080 130
L1390 220">


<animate

attributeName="stroke-opacity"

values=".15;.65;.15"

dur="6s"

repeatCount="indefinite"/>


</path>


<path d="
M390 220
L820 200">


<animate

attributeName="stroke-opacity"

values=".2;.8;.2"

dur="7s"

repeatCount="indefinite"/>


</path>


<path d="
M620 120
L1080 130">


<animate

attributeName="stroke-opacity"

values=".15;.6;.15"

dur="8s"

repeatCount="indefinite"/>


</path>


<path d="
M820 200
L1390 220">


<animate

attributeName="stroke-opacity"

values=".15;.7;.15"

dur="9s"

repeatCount="indefinite"/>


</path>


</g>



<!-- ===================================== -->
<!-- MOVING DATA SIGNALS -->
<!-- ===================================== -->


<g>


<circle

r="4"

fill="#FFFFFF">


<animateMotion

dur="6s"

repeatCount="indefinite"

path="
M180 150
L390 220
L620 120
L820 200
L1080 130
L1390 220"/>


<animate

attributeName="opacity"

values="0;1;1;0"

dur="6s"

repeatCount="indefinite"/>


</circle>



<circle

r="3"

fill="#A78BFA">


<animateMotion

dur="8s"

begin="2s"

repeatCount="indefinite"

path="
M390 220
L820 200
L1080 130"/>


<animate

attributeName="opacity"

values="0;.9;.9;0"

dur="8s"

repeatCount="indefinite"/>


</circle>


</g>




<!-- ===================================== -->
<!-- NETWORK NODES -->
<!-- ===================================== -->


<g filter="url(#networkGlow)">


<circle cx="180" cy="150" r="6"
fill="#FFFFFF">

<animate

attributeName="r"

values="5;8;5"

dur="5s"

repeatCount="indefinite"/>

</circle>



<circle cx="390" cy="220" r="7"
fill="#8B5CF6">

<animate

attributeName="r"

values="6;9;6"

dur="6s"

repeatCount="indefinite"/>

</circle>



<circle cx="620" cy="120" r="6"
fill="#FFFFFF">

<animate

attributeName="r"

values="5;8;5"

dur="5.5s"

repeatCount="indefinite"/>

</circle>



<circle cx="820" cy="200" r="7"
fill="#C4B5FD">

<animate

attributeName="r"

values="6;9;6"

dur="7s"

repeatCount="indefinite"/>

</circle>



<circle cx="1080" cy="130" r="6"
fill="#FFFFFF">

<animate

attributeName="r"

values="5;8;5"

dur="6s"

repeatCount="indefinite"/>

</circle>



<circle cx="1390" cy="220" r="7"
fill="#8B5CF6">

<animate

attributeName="r"

values="6;9;6"

dur="5s"

repeatCount="indefinite"/>

</circle>


</g>





<!-- ===================================== -->
<!-- GLOWING PARTICLES -->
<!-- ===================================== -->


<g>


<circle cx="120" cy="90" r="5"
fill="url(#particle)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;20 -25;0 0"

dur="10s"

repeatCount="indefinite"/>

</circle>



<circle cx="300" cy="70" r="4"
fill="url(#particle)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;-20 30;0 0"

dur="12s"

repeatCount="indefinite"/>

</circle>



<circle cx="520" cy="60" r="5"
fill="url(#particle)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;25 -20;0 0"

dur="11s"

repeatCount="indefinite"/>

</circle>



<circle cx="900" cy="70" r="4"
fill="url(#particle)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;-25 20;0 0"

dur="13s"

repeatCount="indefinite"/>

</circle>



<circle cx="1250" cy="70" r="5"
fill="url(#particle)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;30 -15;0 0"

dur="12s"

repeatCount="indefinite"/>

</circle>



<circle cx="1500" cy="120" r="4"
fill="url(#particle)">

<animateTransform

attributeName="transform"

type="translate"

values="0 0;-25 25;0 0"

dur="10s"

repeatCount="indefinite"/>

</circle>



</g>





<!-- ===================================== -->
<!-- FLOATING AI CODE SYMBOLS -->
<!-- ===================================== -->


<g

font-family="JetBrains Mono,monospace"

font-size="26"

font-weight="600"

fill="#FFFFFF"

opacity=".14">



<text x="130" y="270">

&lt;/&gt;

<animateTransform

attributeName="transform"

type="translate"

values="0 0;0 -20;0 0"

dur="9s"

repeatCount="indefinite"/>

</text>



<text x="300" y="350">

{}

<animateTransform

attributeName="transform"

type="translate"

values="0 0;15 -15;0 0"

dur="12s"

repeatCount="indefinite"/>

</text>



<text x="520" y="120">

AI

<animateTransform

attributeName="transform"

type="translate"

values="0 0;-15 20;0 0"

dur="11s"

repeatCount="indefinite"/>

</text>



<text x="1100" y="90">

LLM

<animateTransform

attributeName="transform"

type="translate"

values="0 0;20 15;0 0"

dur="13s"

repeatCount="indefinite"/>

</text>



<text x="1320" y="330">

RAG

<animateTransform

attributeName="transform"

type="translate"

values="0 0;-20 -15;0 0"

dur="10s"

repeatCount="indefinite"/>

</text>



<text x="1050" y="360">

FastAPI

</text>



<text x="420" y="420">

Python

</text>



</g>


<!-- ===================================== -->
<!-- PART 2 END -->

<!-- ===================================== -->
<!--        PREMIUM TYPOGRAPHY             -->
<!-- ===================================== -->


<defs>


<!-- Animated Text Gradient -->

<linearGradient
id="titleGradient"
x1="0%"
y1="0%"
x2="100%"
y2="0%">


<stop offset="0%"
stop-color="#FFFFFF">


<animate

attributeName="stop-color"

values="
#FFFFFF;
#DDD6FE;
#FFFFFF"

dur="6s"

repeatCount="indefinite"/>


</stop>



<stop offset="50%"
stop-color="#C4B5FD">


<animate

attributeName="stop-color"

values="
#C4B5FD;
#FFFFFF;
#A78BFA"

dur="6s"

repeatCount="indefinite"/>


</stop>



<stop offset="100%"
stop-color="#8B5CF6">


<animate

attributeName="stop-color"

values="
#8B5CF6;
#C4B5FD;
#8B5CF6"

dur="6s"

repeatCount="indefinite"/>


</stop>


</linearGradient>



<!-- Text Glow -->

<filter id="textGlow">

<feGaussianBlur
stdDeviation="4"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>


</filter>


</defs>





<!-- ===================================== -->
<!-- PREMIUM FINAL TITLE -->
<!-- ===================================== -->


<text

x="800"

y="170"

text-anchor="middle"

font-family="Arial, Helvetica, sans-serif"

font-size="68"

font-weight="900"

letter-spacing="1"

fill="url(#titleGradient)"

stroke="#FFFFFF"

stroke-opacity=".18"

stroke-width="1"

filter="url(#textGlow)">

Swastik Mohanty

</text>



<!-- ===================================== -->
<!-- ROLE -->
<!-- ===================================== -->


<text

x="800"

y="220"

text-anchor="middle"

font-family="Arial, Helvetica, sans-serif"

font-size="26"

font-weight="700"

letter-spacing="3"

fill="#FFFFFF"

opacity=".95">

ENTERPRISE AI ENGINEER

</text>



<!-- ===================================== -->
<!-- DESCRIPTION -->
<!-- ===================================== -->


<text

x="800"

y="280"

text-anchor="middle"

font-family="monospace"

font-size="22"

font-weight="600"

fill="#FFFFFF"

opacity=".95">

Building Production-Ready LLM Systems

</text>



<text

x="800"

y="320"

text-anchor="middle"

font-family="monospace"

font-size="18"

font-weight="600"

fill="#DDD6FE">

RAG • Multi-Agent AI • NLP • Python • FastAPI • Azure

</text>




<!-- ===================================== -->
<!-- BOTTOM AURORA -->
<!-- ===================================== -->


<ellipse

cx="800"

cy="450"

rx="500"

ry="80"

fill="#8B5CF6"

opacity=".15"

filter="url(#glow)">


<animate

attributeName="rx"

values="450;600;450"

dur="12s"

repeatCount="indefinite"/>


</ellipse>





<!-- ===================================== -->
<!-- ANIMATED WAVES -->
<!-- ===================================== -->


<!-- Wave 1 -->

<path

fill="#FFFFFF"

fill-opacity=".10">


<animate

attributeName="d"

dur="12s"

repeatCount="indefinite"


values="

M0 400

C250 330 500 470 800 390

C1100 320 1350 460 1600 390

L1600 500

L0 500 Z;



M0 390

C250 470 500 330 800 410

C1100 480 1350 350 1600 410

L1600 500

L0 500 Z;



M0 400

C250 330 500 470 800 390

C1100 320 1350 460 1600 390

L1600 500

L0 500 Z

"/>

</path>





<!-- Wave 2 -->

<path

fill="#C4B5FD"

fill-opacity=".08">


<animate

attributeName="d"

dur="16s"

repeatCount="indefinite"


values="

M0 430

C300 380 600 480 900 420

C1200 350 1450 470 1600 420

L1600 500

L0 500 Z;



M0 420

C300 480 600 360 900 440

C1200 500 1450 370 1600 430

L1600 500

L0 500 Z;



M0 430

C300 380 600 480 900 420

C1200 350 1450 470 1600 420

L1600 500

L0 500 Z

"/>

</path>





<!-- Wave 3 -->

<path

fill="#8B5CF6"

fill-opacity=".10">


<animate

attributeName="d"

dur="20s"

repeatCount="indefinite"


values="

M0 450

C350 400 700 500 1000 430

C1300 390 1500 470 1600 440

L1600 500

L0 500 Z;



M0 440

C350 500 700 390 1000 450

C1300 500 1500 410 1600 450

L1600 500

L0 500 Z;



M0 450

C350 400 700 500 1000 430

C1300 390 1500 470 1600 440

L1600 500

L0 500 Z

"/>

</path>





<!-- ===================================== -->
<!-- FINAL EDGE GLOW -->
<!-- ===================================== -->


<rect

x="0"

y="0"

width="1600"

height="500"

fill="none"

stroke="#FFFFFF"

stroke-opacity=".05"/>



</svg>
